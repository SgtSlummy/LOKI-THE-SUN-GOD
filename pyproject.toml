[project]
name = "loki-discord-relay"
version = "0.1.0"
description = "Railway-hosted Discord relay bot backend with plugin slots and clean media handling."
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.12,<4",
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  "discord.py>=2.6,<3",
  "openai>=2.0,<3",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

